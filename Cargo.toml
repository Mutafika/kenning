[package]
name = "kenning"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"        # enchudb 0.16+ の MSRV (std::fs::File::lock)。edition 2024 の下限 1.85 より上
description = "Semantic code search for Rust, built for AI coding agents — rust-analyzer facts baked into an embedded faceted DB, served in microseconds"
license = "MIT"
repository = "https://github.com/Mutafika/kenning"

[dependencies]
# クエリエンジン = enchudb (紐/円柱、全列自動 index の faceted 等値 AND が設計点)。
# git dep は release tag で pin する — v0.14.0 以降は annotated tag なので `git rev-parse vX` は
# tag object の hash を返す (commit ではない)。生 hash を書くとそこで事故るため tag 指定にする。
# ローカル開発で兄弟 dir の enchudb を使う時は .cargo/config.toml の [patch] で差し替え
# (gitignore 済み。patch 有効中は Cargo.lock が書き換わるので commit に混ぜない)。
# 0.14.4 → 0.25.1 (2026-08): API 互換 (コード変更なし)。standalone に効くのは torn read (#119/#128/#132)、
# readonly open の RSS リーク (#127)、WAL tail 消失 (0.21)、満杯で process 死 / disk full SIGBUS (#59/#167)、
# growable の lazy commit (0.25、実 disk 半減)。代償は single-writer 書込 -35% (HLC lock、実測 index 0.48→0.58s)。
# 0.23+ は容量満杯を panic でなく「拒否 + 計数」にしたので、書き終わりに fault_total を検査する (assert_no_faults)。
# 0.25.1 → 0.26.1 (2026-09): API 互換だが **on-disk format v10 = db が単一ファイルから directory へ (breaking)**。
# 得: kenning 自身の index で apparent 1610→272MB / 実 34→16MB (cache 全体 21 db で実 1.2GB→約半分)。
# 損: open が 218→567µs (v10 は 1 region = 1 file で file 数に比例。0.26.1 の遅延 open で 1853µs から回収済み。
# .crc 封緘 / sync 有効だと遅延が効かないが kenning はどちらも未使用)。across 20db 並列 21.8→27.9ms。
# 旧 v9 の db は open で弾かれる (src は 1 byte も触られない) → maybe_auto_update が full 再 index で自己修復。
# ⚠ v10 の db は directory なので「is_dir なら repo」判別が壊れる。振り分けは is_db_path を使うこと。
# 0.26.1 → 0.26.6 (2026-09-04): format 不変・breaking なし、追従のみ。0.26.5 (#255, writer open の eager
# cylinder build 撤去) は kenning の db 形状には効かなかった — tokio 725 files で update 無変更 100→91ms
# (誤差内)。ENCHU_OPEN_PROFILE で open は 0ms で、90ms の正体は update_inner が全ファイルを読んで hash
# 照合する kenning 側の 31ms + process/rw open/drop の固定費。0.26.2〜0.26.4 / 0.26.6 は docs・migrate・
# Windows・sync transport の修正で kenning の経路には無関係。
enchudb = { git = "https://github.com/Mutafika/enchudb", tag = "v0.26.6" }
enchudb-oplog = { git = "https://github.com/Mutafika/enchudb", tag = "v0.26.6" }
# indexer = syn で Rust ソースをパースして symbol/call fact を抽出。
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
# 索引対象を決める walk (.rs / それ以外の共通土台)。.gitignore/.ignore を尊重する
# (= ripgrep と同じ規約) ので、生成物・vendor 複製・巨大データが index に紛れ込まない。
ignore = "0.4"
# 正確な名前解決 = rust-analyzer の SCIP 出力を食う (occurrence を位置で syn と join)。
scip = "0.5"
protobuf = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
